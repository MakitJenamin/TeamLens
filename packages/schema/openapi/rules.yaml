# M1.9: đọc findings của session. M2.8: chạy lại rule cho project. Quản lý rule theo project thuộc M4.4.
paths:
  /api/v1/sessions/{sessionId}/findings:
    parameters:
      - $ref: './sessions.yaml#/components/parameters/SessionId'
    get:
      operationId: listSessionFindings
      tags: [rules]
      summary: Danh sách nhận xét của một session
      description: |
        Member xem session của mình, leader xem mọi session. Ghi audit khi xem dữ liệu của người khác.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Các nhận xét đã ghi nhận. Danh sách rỗng khi chưa có nhận xét.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionFindings'
              examples:
                withFinding:
                  value:
                    items:
                      - id: 2356eb16-0734-42a0-9c8a-892a394bcaf2
                        ruleKey: repeated-correction
                        severity: high
                        message: Ba prompt liên tiếp cho biết lỗi vẫn còn.
                        turnSeq: 12
                        evidenceExcerpt: Vẫn lỗi khi chạy lại.
                empty:
                  value:
                    items: []
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /api/v1/projects/{projectId}/rules/rerun:
    parameters:
      - $ref: './common.yaml#/components/parameters/ProjectId'
    post:
      operationId: rerunProjectRules
      tags: [rules]
      summary: Chấm lại mọi session của project bằng rule hiện hành
      description: |
        Chỉ leader. Server nhận lệnh rồi chấm lại ở nền (pg-boss), nên trả `202` ngay mà không đợi chấm xong.
        Mỗi session gốc còn đủ turn được chấm lại: finding, điểm 5 nhóm và `user_weekly_stats` của các tuần liên quan
        được tính lại. Session con không có điểm. Session đã bị retention xóa turn giữ nguyên điểm cũ.
        Gọi nhiều lần liên tiếp chỉ làm việc chấm lại lặp lại, không tạo bản ghi trùng.
        Ghi audit `rules.rerun`.
      security:
        - cookieAuth: []
      responses:
        '202':
          description: Đã nhận lệnh, việc chấm lại đang chạy ở nền.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleRerunAccepted'
              example:
                status: queued
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

components:
  schemas:
    SessionFindings:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionFinding'
    SessionFinding:
      type: object
      required: [id, ruleKey, severity, message, turnSeq, evidenceExcerpt]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Id'
        ruleKey:
          type: string
          minLength: 1
          description: Khóa của rule đã tạo nhận xét.
        severity:
          type: string
          enum: [low, medium, high]
        message:
          type: string
          minLength: 1
          description: Nhận xét hiển thị cho người xem session.
        turnSeq:
          type: [integer, 'null']
          minimum: 0
          description: Số thứ tự turn làm bằng chứng, hoặc null nếu nhận xét áp dụng cho cả session.
        evidenceExcerpt:
          type: [string, 'null']
          minLength: 1
          description: Đoạn trích ngắn đã che secret nếu có bằng chứng văn bản còn được lưu.
    RuleRerunAccepted:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [queued]
          description: Lệnh chấm lại đã được xếp hàng.
