# Nhóm `devices` (phía dashboard): xem và thu hồi thiết bị.
# Thiết bị được tạo khi thành viên chạy `tl join` (`POST /agent/v1/join`, invites.yaml).
paths:
  /api/v1/devices:
    get:
      operationId: listMyDevices
      tags: [devices]
      summary: Thiết bị của chính user đang đăng nhập
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Danh sách thiết bị (kể cả đã thu hồi).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './common.yaml#/components/schemas/Device'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'

  /api/v1/devices/{deviceId}/revoke:
    parameters:
      - $ref: './common.yaml#/components/parameters/DeviceId'
    post:
      operationId: revokeDevice
      tags: [devices]
      summary: Thu hồi token của một thiết bị (chủ thiết bị hoặc leader)
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Đã thu hồi (gọi lại trên thiết bị đã thu hồi cũng trả 204).
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
