# Quản trị toàn server (chỉ leader), spec mục 7.4 và 11. Task: M4.5, M4.6, M5.5, M5.6.
# - GET/PATCH /api/v1/admin/settings (retention, pattern redaction, văn bản đồng ý; key AI do từng người tự nhập, xem ai.yaml)
# - GET /api/v1/audit
# - DELETE /api/v1/admin/users/{userId} (xóa toàn bộ dữ liệu của một người, M5.6)
#
# Cách thêm endpoint:
# 1. Viết path item dưới `paths:` bên dưới (path đầy đủ, vd. `/api/v1/...`), schema dùng chung
#    tham chiếu `./common.yaml#/components/...`.
# 2. Trong openapi/openapi.yaml thêm một dòng dưới `paths:`, vd.
#      /agent/v1/ingest:
#        $ref: './admin.yaml#/paths/~1agent~1v1~1ingest'
#    (`/` trong path viết thành `~1` theo JSON Pointer).
# 3. Chạy `pnpm --filter @teamlens/schema build` và commit cả src/generated/api.ts.
paths:
  /api/v1/admin/settings:
    get:
      operationId: getServerSettings
      tags: [admin]
      summary: 'Cài đặt server: redaction, retention và văn bản đồng ý (leader)'
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Giá trị hiện hành và số thiết bị sẽ cần đồng ý lại khi sửa văn bản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerSettings'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
    patch:
      operationId: updateServerSettings
      tags: [admin]
      summary: Cập nhật cài đặt server (leader)
      description: Sửa văn bản đồng ý cần expectedConsentVersion; nếu đổi nội dung sẽ tăng version và thiết bị phải chạy tl consent. Job retention hằng đêm (M5.5) đọc retentionDays ở lần chạy kế tiếp.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                redactionPatterns:
                  type: array
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/RedactionPattern'
                retentionDays:
                  type: [integer, 'null']
                  minimum: 7
                  maximum: 730
                  description: null là lưu vô hạn. Job retention hằng đêm xóa nội dung thô cũ hơn số ngày này.
                consentText:
                  type: string
                  minLength: 1
                expectedConsentVersion:
                  type: string
      responses:
        '200':
          description: Cấu hình mới sau khi lưu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerSettings'
        '400':
          description: Cấu hình hoặc regex không hợp lệ (`pattern_invalid`).
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '409':
          description: Phiên bản văn bản đã đổi (`consent_version_conflict`).
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'

  /api/v1/admin/settings/redaction-test:
    post:
      operationId: testRedactionPattern
      tags: [admin]
      summary: Thử regex Rust trên đoạn mẫu trong bộ nhớ, không lưu hoặc log (leader)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, regex, sample]
              properties:
                id:
                  type: string
                regex:
                  type: string
                  minLength: 1
                sample:
                  type: string
                  maxLength: 4096
      responses:
        '200':
          description: Kết quả thử, chỉ trả số vùng khớp và văn bản đã che.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [matches, redacted]
                properties:
                  matches:
                    type: integer
                  redacted:
                    type: string
        '400':
          description: Pattern không hợp lệ (`pattern_invalid`).
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'

  /api/v1/admin/users/{userId}:
    delete:
      operationId: eraseUser
      tags: [admin]
      summary: Xóa toàn bộ dữ liệu của một người (leader)
      description: |
        Xóa hẳn người dùng cùng mọi dữ liệu của họ: session (kèm turn, finding, điểm, ghi chú, mục
        thư viện prompt trỏ tới), thiết bị và device token, bản đồng ý, thống kê tuần, kết quả AI
        của họ và kết quả AI về dữ liệu của họ, API key AI, token `tlp_`, ghi chú họ viết, thành viên
        project. Audit log giữ lại (người thực hiện thành null), kèm một dòng `user.erase`.
        Không hoàn tác được. Người đó muốn dùng lại thì tham gia lại bằng link mời như người mới.
      security:
        - cookieAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: './common.yaml#/components/schemas/Id'
      responses:
        '200':
          description: Đã xóa; số bản ghi chính đã xóa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserErasure'
        '400':
          description: Không tự xóa chính mình (`cannot_erase_self`).
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                error: cannot_erase_self
                message: Không thể xóa dữ liệu của chính bạn
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          description: Đây là leader cuối cùng (`last_leader`).
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'

  /api/v1/audit:
    get:
      operationId: listAuditLog
      tags: [admin]
      summary: Nhật ký audit toàn server (chỉ leader)
      security:
        - cookieAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 20
            maximum: 100
            default: 20
        - name: action
          in: query
          schema:
            type: string
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: targetType
          in: query
          schema:
            type: string
        - name: targetId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Danh sách audit theo thứ tự thời gian giảm dần, phân trang ổn định.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: './common.yaml#/components/responses/ValidationError'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'

components:
  schemas:
    RedactionPattern:
      type: object
      additionalProperties: false
      required: [id, name, regex]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9_]+$'
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        regex:
          type: string
          minLength: 1
          description: Cú pháp crate regex của Rust; tối đa 4096 byte UTF-8.

    ServerSettings:
      type: object
      additionalProperties: false
      required: [redactionPatterns, retentionDays, consentText, affectedDevices, retentionLastRun]
      properties:
        redactionPatterns:
          type: array
          items:
            $ref: '#/components/schemas/RedactionPattern'
        retentionDays:
          type: [integer, 'null']
        consentText:
          type: object
          additionalProperties: false
          required: [version, text]
          properties:
            version:
              type: string
            text:
              type: string
        affectedDevices:
          type: integer
          description: Số thiết bị có consent còn hiệu lực với phiên bản văn bản hiện tại.
        retentionLastRun:
          oneOf:
            - $ref: '#/components/schemas/RetentionRun'
            - type: 'null'
          description: Lần chạy gần nhất của job retention; null khi chưa chạy lần nào.

    RetentionRun:
      type: object
      additionalProperties: false
      required: [at, retentionDays, cutoff, droppedPartitions, deletedTurns, deletedAiResults, deletedNotes, deletedPromptLibrary]
      properties:
        at:
          type: string
          format: date-time
        retentionDays:
          type: [integer, 'null']
          description: Giá trị dùng ở lần chạy đó; null là vô hạn (không xóa gì).
        cutoff:
          type: [string, 'null']
          format: date-time
          description: Nội dung thô có thời điểm trước mốc này bị xóa; null khi vô hạn.
        droppedPartitions:
          type: array
          items:
            type: string
          description: Partition `turns` đã drop (cả tháng quá hạn).
        deletedTurns:
          type: integer
          description: Turn xóa lẻ trong partition chỉ quá hạn một phần.
        deletedAiResults:
          type: integer
        deletedNotes:
          type: integer
        deletedPromptLibrary:
          type: integer

    UserErasure:
      type: object
      additionalProperties: false
      required: [userId, sessions, devices]
      properties:
        userId:
          $ref: './common.yaml#/components/schemas/Id'
        sessions:
          type: integer
          description: Số session đã xóa, kể cả session con.
        devices:
          type: integer

    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, actorId, actorName, action, targetType, targetId, at]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Id'
        actorId:
          type: [string, 'null']
          format: uuid
        actorName:
          type: [string, 'null']
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        at:
          type: string
          format: date-time

    AuditPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        nextCursor:
          type: [string, 'null']
