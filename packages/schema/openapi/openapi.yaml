# File gốc của contract OpenAPI. Mỗi nhóm endpoint nằm ở một file riêng trong thư mục này;
# file gốc chỉ khai báo info, server, security scheme, tag và tham chiếu từng path.
#
# Thêm path mới: viết path item trong file nhóm, rồi thêm một dòng `$ref` dưới `paths:`
# (`/` trong path viết thành `~1`). Xem packages/schema/AGENTS.md.
#
# File nhóm còn là khung (`paths: {}`), chưa có path nào để tham chiếu:
#   invites.yaml · consent.yaml · stats.yaml · admin.yaml
# agent.yaml có ingest, config (heartbeat viết sau).
openapi: 3.1.0
info:
  title: TeamLens API
  version: 0.1.0
  summary: API của TeamLens cho dashboard (`/api/v1`) và CLI `tl` (`/agent/v1`).
  description: |
    - Dashboard: prefix `/api/v1`, xác thực bằng cookie `tl_session`.
    - CLI: prefix `/agent/v1`, header `Authorization: Bearer tld_...`.
    - JSON của REST API dùng camelCase; riêng payload ingest session theo `session.v1.schema.json` (snake_case).
    - Lỗi luôn có dạng `{ "error": "<mã>", "message": "<mô tả tiếng Việt>" }`.
      Mã chung: `unauthenticated` (401), `forbidden` (403), `not_found` (404), `validation_error` (400),
      `invalid_token` (401, CLI).
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only

servers:
  - url: http://localhost:3001
    description: API khi phát triển (web :3000 proxy `/api/*` và `/agent/*` sang đây).

tags:
  - name: health
    description: Kiểm tra sống.
  - name: setup
    description: Tạo leader đầu tiên.
  - name: auth
    description: Đăng nhập dashboard.
  - name: projects
    description: Project, thành viên, repo pattern.
  - name: users
    description: Quản lý tài khoản và vai trò (leader).
  - name: devices
    description: Xem và thu hồi thiết bị (dashboard).
  - name: agent-auth
    description: whoami, logout và web-login (`tl open`) của CLI.
  - name: agent
    description: CLI gửi dữ liệu (ingest session).
  - name: sessions
    description: Xem session trên dashboard.
  - name: rules
    description: Rule và nhận xét về session.
  - name: invites
    description: Link mời chung và tham gia bằng `tl join`.

paths:
  # health.yaml
  /health:
    $ref: './health.yaml#/paths/~1health'

  # setup.yaml
  /api/v1/setup/status:
    $ref: './setup.yaml#/paths/~1api~1v1~1setup~1status'
  /api/v1/setup:
    $ref: './setup.yaml#/paths/~1api~1v1~1setup'

  # auth.yaml
  /api/v1/auth/login:
    $ref: './auth.yaml#/paths/~1api~1v1~1auth~1login'
  /api/v1/auth/logout:
    $ref: './auth.yaml#/paths/~1api~1v1~1auth~1logout'
  /api/v1/auth/me:
    $ref: './auth.yaml#/paths/~1api~1v1~1auth~1me'
  /api/v1/auth/ticket:
    $ref: './auth.yaml#/paths/~1api~1v1~1auth~1ticket'

  # projects.yaml
  /api/v1/projects:
    $ref: './projects.yaml#/paths/~1api~1v1~1projects'
  /api/v1/projects/{projectId}:
    $ref: './projects.yaml#/paths/~1api~1v1~1projects~1{projectId}'
  /api/v1/projects/{projectId}/members:
    $ref: './projects.yaml#/paths/~1api~1v1~1projects~1{projectId}~1members'
  /api/v1/projects/{projectId}/members/{userId}:
    $ref: './projects.yaml#/paths/~1api~1v1~1projects~1{projectId}~1members~1{userId}'
  /api/v1/projects/{projectId}/repos:
    $ref: './projects.yaml#/paths/~1api~1v1~1projects~1{projectId}~1repos'
  /api/v1/projects/{projectId}/repos/{repoId}:
    $ref: './projects.yaml#/paths/~1api~1v1~1projects~1{projectId}~1repos~1{repoId}'

  # users.yaml
  /api/v1/users:
    $ref: './users.yaml#/paths/~1api~1v1~1users'
  /api/v1/users/{userId}:
    $ref: './users.yaml#/paths/~1api~1v1~1users~1{userId}'
  /api/v1/users/{userId}/merge:
    $ref: './users.yaml#/paths/~1api~1v1~1users~1{userId}~1merge'

  # devices.yaml
  /api/v1/devices:
    $ref: './devices.yaml#/paths/~1api~1v1~1devices'
  /api/v1/devices/{deviceId}/revoke:
    $ref: './devices.yaml#/paths/~1api~1v1~1devices~1{deviceId}~1revoke'

  # agent-auth.yaml
  /agent/v1/whoami:
    $ref: './agent-auth.yaml#/paths/~1agent~1v1~1whoami'
  /agent/v1/logout:
    $ref: './agent-auth.yaml#/paths/~1agent~1v1~1logout'
  /agent/v1/web-login:
    $ref: './agent-auth.yaml#/paths/~1agent~1v1~1web-login'

  # agent.yaml
  /agent/v1/ingest:
    $ref: './agent.yaml#/paths/~1agent~1v1~1ingest'
  /agent/v1/config:
    $ref: './agent.yaml#/paths/~1agent~1v1~1config'

  # sessions.yaml
  /api/v1/projects/{projectId}/sessions:
    $ref: './sessions.yaml#/paths/~1api~1v1~1projects~1{projectId}~1sessions'
  /api/v1/sessions/{sessionId}:
    $ref: './sessions.yaml#/paths/~1api~1v1~1sessions~1{sessionId}'
  /api/v1/sessions/{sessionId}/notes:
    $ref: './sessions.yaml#/paths/~1api~1v1~1sessions~1{sessionId}~1notes'
  /api/v1/sessions/{sessionId}/notes/{noteId}:
    $ref: './sessions.yaml#/paths/~1api~1v1~1sessions~1{sessionId}~1notes~1{noteId}'

  /api/v1/sessions/{sessionId}/findings:
    $ref: './rules.yaml#/paths/~1api~1v1~1sessions~1{sessionId}~1findings'

  # invites.yaml
  /api/v1/projects/{projectId}/invites:
    $ref: './invites.yaml#/paths/~1api~1v1~1projects~1{projectId}~1invites'
  /api/v1/projects/{projectId}/invites/{inviteId}:
    $ref: './invites.yaml#/paths/~1api~1v1~1projects~1{projectId}~1invites~1{inviteId}'
  /agent/v1/invites/{code}:
    $ref: './invites.yaml#/paths/~1agent~1v1~1invites~1{code}'
  /agent/v1/join:
    $ref: './invites.yaml#/paths/~1agent~1v1~1join'

  # consent.yaml, stats.yaml, admin.yaml:
  # thêm `$ref` ở đây khi các file đó có path.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: tl_session
      description: Cookie phiên đăng nhập dashboard (đặt bởi `/api/v1/auth/login` hoặc `/api/v1/setup`).
    deviceToken:
      type: http
      scheme: bearer
      bearerFormat: tld_<token>
      description: Device token của CLI, lấy qua `POST /agent/v1/join` (`tl join <link mời>`).

  # Đăng ký lại schema dùng chung để type sinh ra có tên ổn định (components["schemas"]["User"]...).
  schemas:
    Error:
      $ref: './common.yaml#/components/schemas/Error'
    Id:
      $ref: './common.yaml#/components/schemas/Id'
    Role:
      $ref: './common.yaml#/components/schemas/Role'
    User:
      $ref: './common.yaml#/components/schemas/User'
    UserRef:
      $ref: './common.yaml#/components/schemas/UserRef'
    Membership:
      $ref: './common.yaml#/components/schemas/Membership'
    ProjectSlug:
      $ref: './common.yaml#/components/schemas/ProjectSlug'
    ProjectSettings:
      $ref: './common.yaml#/components/schemas/ProjectSettings'
    ProjectListItem:
      $ref: './common.yaml#/components/schemas/ProjectListItem'
    Project:
      $ref: './common.yaml#/components/schemas/Project'
    ProjectDetail:
      $ref: './common.yaml#/components/schemas/ProjectDetail'
    RemotePattern:
      $ref: './common.yaml#/components/schemas/RemotePattern'
    Repo:
      $ref: './common.yaml#/components/schemas/Repo'
    Member:
      $ref: './common.yaml#/components/schemas/Member'
    DeviceStatus:
      $ref: './common.yaml#/components/schemas/DeviceStatus'
    DeviceRef:
      $ref: './common.yaml#/components/schemas/DeviceRef'
    Device:
      $ref: './common.yaml#/components/schemas/Device'

    # session.v1.schema.json (payload ingest, snake_case). Bundler tự thêm các `$defs` con với tên gốc
    # (`Session`, `SessionEnvelope`, `Turn`, `Tool`, `Output`, `Diff`, `Usage`, ...); src/index.ts export
    # lại dưới tên có tiền tố `Ingest` để không nhầm với type REST (`SessionSummary`, `SessionTurn`...).
    IngestBatch:
      $ref: '../session.v1.schema.json#/$defs/IngestBatch'

    # agent.yaml
    IngestResult:
      $ref: './agent.yaml#/components/schemas/IngestResult'
    IngestAccepted:
      $ref: './agent.yaml#/components/schemas/IngestAccepted'
    IngestRejected:
      $ref: './agent.yaml#/components/schemas/IngestRejected'
    UnsupportedSchemaVersionError:
      $ref: './agent.yaml#/components/schemas/UnsupportedSchemaVersionError'
    AgentConfig:
      $ref: './agent.yaml#/components/schemas/AgentConfig'
    AgentRepoPattern:
      $ref: './agent.yaml#/components/schemas/AgentRepoPattern'
    AgentRedactionPattern:
      $ref: './agent.yaml#/components/schemas/AgentRedactionPattern'
    AgentTruncation:
      $ref: './agent.yaml#/components/schemas/AgentTruncation'

    # invites.yaml
    InviteStatus:
      $ref: './invites.yaml#/components/schemas/InviteStatus'
    Invite:
      $ref: './invites.yaml#/components/schemas/Invite'
    CreatedInvite:
      $ref: './invites.yaml#/components/schemas/CreatedInvite'
    ConsentText:
      $ref: './invites.yaml#/components/schemas/ConsentText'
    InvitePreview:
      $ref: './invites.yaml#/components/schemas/InvitePreview'
    JoinRequest:
      $ref: './invites.yaml#/components/schemas/JoinRequest'
    JoinResult:
      $ref: './invites.yaml#/components/schemas/JoinResult'

    SessionFinding:
      $ref: './rules.yaml#/components/schemas/SessionFinding'
    SessionFindings:
      $ref: './rules.yaml#/components/schemas/SessionFindings'
    # sessions.yaml
    AgentKind:
      $ref: './sessions.yaml#/components/schemas/AgentKind'
    PermissionMode:
      $ref: './sessions.yaml#/components/schemas/PermissionMode'
    TokenUsage:
      $ref: './sessions.yaml#/components/schemas/TokenUsage'
    SessionSummary:
      $ref: './sessions.yaml#/components/schemas/SessionSummary'
    SessionPage:
      $ref: './sessions.yaml#/components/schemas/SessionPage'
    InstructionFile:
      $ref: './sessions.yaml#/components/schemas/InstructionFile'
    SessionDetail:
      $ref: './sessions.yaml#/components/schemas/SessionDetail'
    SessionTurn:
      $ref: './sessions.yaml#/components/schemas/SessionTurn'
    TurnTool:
      $ref: './sessions.yaml#/components/schemas/TurnTool'
    TurnOutput:
      $ref: './sessions.yaml#/components/schemas/TurnOutput'
    TurnDiff:
      $ref: './sessions.yaml#/components/schemas/TurnDiff'
    TurnUsage:
      $ref: './sessions.yaml#/components/schemas/TurnUsage'
    TurnCount:
      $ref: './sessions.yaml#/components/schemas/TurnCount'
    SessionChild:
      $ref: './sessions.yaml#/components/schemas/SessionChild'
    SessionNote:
      $ref: './sessions.yaml#/components/schemas/SessionNote'
    SessionNoteList:
      $ref: './sessions.yaml#/components/schemas/SessionNoteList'
    CreateSessionNoteRequest:
      $ref: './sessions.yaml#/components/schemas/CreateSessionNoteRequest'
