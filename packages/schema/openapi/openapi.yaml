components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: tl_session
      description: Cookie phiên đăng nhập dashboard (đặt bởi `/api/v1/auth/login` hoặc `/api/v1/setup`).
    deviceToken:
      type: http
      scheme: bearer
      bearerFormat: tld_<token>
      description: Device token của CLI, lấy qua `POST /agent/v1/join` (`tl join <link mời>`).
    agentToken:
      type: http
      scheme: bearer
      bearerFormat: tlp_<token>
      description: Token cá nhân cho agent gọi MCP, tạo ở `POST /api/v1/me/agent-tokens` (trang Cài đặt AI).

