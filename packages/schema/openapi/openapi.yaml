# File gốc của contract OpenAPI. Mỗi nhóm endpoint nằm ở một file riêng trong thư mục này;
# file gốc chỉ khai báo info, server, security scheme, tag và tham chiếu từng path.
#
# Thêm path mới: viết path item trong file nhóm, rồi thêm một dòng `$ref` dưới `paths:`
# (`/` trong path viết thành `~1`). Xem packages/schema/AGENTS.md.
#
# members.yaml có member-status (M4.2).
# File nhóm còn là khung (`paths: {}`), chưa có path nào để tham chiếu:
#   admin.yaml
# skills.yaml có skill-clusters (M6.11, Skill Finder S0) và nút AI S1, S2 (M6.12); S3 (M6.13): nguồn catalog và chọn skill.
# prompt-library.yaml (M6.14): tìm prompt mẫu (AI) và thư viện prompt đã duyệt.
# Mốc 6 (M6.0): ai.yaml (key AI của tôi, kết quả AI A1/A4/A5), agent-tokens.yaml (token `tlp_`),
# mcp.yaml (endpoint `/api/v1/mcp`, chi tiết tool ở packages/schema/mcp/).
# consent.yaml có GET/POST /agent/v1/consent (M3.5).
# stats.yaml có overview (M2.9) và profile (M2.10); leaderboard thêm sau.
# agent.yaml có ingest, config, heartbeat.
openapi: 3.1.0
info:
  title: TeamLens API
  version: 0.1.0
  summary: API của TeamLens cho dashboard (`/api/v1`) và CLI `tl` (`/agent/v1`).
  description: |
    - Dashboard: prefix `/api/v1`, xác thực bằng cookie `tl_session`.
    - CLI: prefix `/agent/v1`, header `Authorization: Bearer tld_...`.
    - MCP: `/api/v1/mcp`, header `Authorization: Bearer tld_...` hoặc `Bearer tlp_...` (token cá nhân).
    - JSON của REST API dùng camelCase; riêng payload ingest session theo `session.v1.schema.json` (snake_case).
    - Lỗi luôn có dạng `{ "error": "<mã>", "message": "<mô tả tiếng Việt>" }`.
      Mã chung: `unauthenticated` (401), `forbidden` (403), `not_found` (404), `validation_error` (400),
      `invalid_token` (401, CLI).
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only

servers:
  - url: http://localhost:3001
    description: API khi phát triển (web :3000 proxy `/api/*` và `/agent/*` sang đây).

tags:
  - name: health
    description: Kiểm tra sống.
  - name: setup
    description: Tạo leader đầu tiên.
  - name: auth
    description: Đăng nhập dashboard.
  - name: projects
    description: Project, thành viên, repo pattern.
  - name: users
    description: Quản lý tài khoản và vai trò (leader).
  - name: devices
    description: Xem và thu hồi thiết bị (dashboard).
  - name: agent-auth
    description: whoami, logout và web-login (`tl open`) của CLI.
  - name: agent
    description: CLI gửi dữ liệu (ingest session).
  - name: sessions
    description: Xem session trên dashboard.
  - name: rules
    description: Rule và nhận xét về session.
  - name: invites
    description: Link mời chung và tham gia bằng `tl join`.
  - name: stats
    description: Thống kê và điểm (tổng quan project, leaderboard, hồ sơ thành viên).
  - name: consent
    description: Đồng ý và rút đồng ý thu thập dữ liệu (CLI).
  - name: members
    description: Trang Thành viên (leader) kèm thiết bị và trạng thái.
  - name: ai
    description: API key AI của tôi (BYO) và kết quả AI trên session.
  - name: agent-tokens
    description: Token cá nhân `tlp_` cho agent gọi MCP.
  - name: mcp
    description: Endpoint MCP (Streamable HTTP, JSON-RPC 2.0) cho agent.
  - name: skills
    description: Skill Finder (cụm prompt lặp lại, gợi ý skill).
  - name: prompt-library
    description: Thư viện prompt mẫu của project (leader duyệt, thành viên xem).

