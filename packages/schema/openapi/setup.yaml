# Nhóm `setup`: tạo tài khoản leader đầu tiên khi server mới cài (trang /setup).
paths:
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      tags: [setup]
      summary: Kiểm tra server đã được setup chưa
      security: []
      responses:
        '200':
          description: Trạng thái setup.
          content:
            application/json:
              schema:
                type: object
                required: [needsSetup]
                additionalProperties: false
                properties:
                  needsSetup:
                    type: boolean
                    description: '`true` khi chưa có user nào trong hệ thống.'

  /api/v1/setup:
    post:
      operationId: setup
      tags: [setup]
      summary: Tạo leader đầu tiên và đăng nhập luôn
      description: |
        Chỉ dùng được khi chưa có user nào. Tài khoản tạo ra có `role = leader`.
        Wizard `/setup` gửi kèm `project` (tùy chọn): server tạo luôn project, repo pattern, thêm leader
        làm thành viên và tạo một link mời mặc định (7 ngày, không giới hạn lượt), trả về trong `invite`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 8
                project:
                  type: object
                  required: [name, slug, repoPatterns]
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                      minLength: 1
                    slug:
                      $ref: './common.yaml#/components/schemas/ProjectSlug'
                    repoPatterns:
                      type: array
                      minItems: 1
                      maxItems: 20
                      items:
                        type: string
                        description: Pattern remote, server chuẩn hóa như khi thêm repo.
      responses:
        '201':
          description: Đã tạo leader; cookie `tl_session` được đặt.
          headers:
            Set-Cookie:
              $ref: './common.yaml#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                type: object
                required: [user]
                additionalProperties: false
                properties:
                  user:
                    $ref: './common.yaml#/components/schemas/User'
                  project:
                    $ref: './common.yaml#/components/schemas/ProjectDetail'
                  invite:
                    $ref: './invites.yaml#/components/schemas/CreatedInvite'
        '400':
          description: 'Body sai (`validation_error`) hoặc repo pattern không hợp lệ (`invalid_pattern`).'
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '409':
          description: 'Server đã có user (`error`: `already_setup`).'
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                error: already_setup
                message: Server đã được cài đặt.
