# Nhóm `agent-auth`: whoami, logout và web-login (`tl open`) của CLI.
# Token thiết bị (tiền tố `tld_`) lấy qua `POST /agent/v1/join` (invites.yaml), gửi qua header
# `Authorization: Bearer tld_...`.
# Request hợp lệ bằng device token cập nhật `devices.last_seen_at` (tối đa 5 phút một lần).
paths:
  /agent/v1/whoami:
    get:
      operationId: agentWhoami
      tags: [agent-auth]
      summary: User, thiết bị và project của token hiện tại
      security:
        - deviceToken: []
      responses:
        '200':
          description: Thông tin của token.
          content:
            application/json:
              schema:
                type: object
                required: [user, role, device, projects]
                additionalProperties: false
                properties:
                  user:
                    allOf:
                      - $ref: './common.yaml#/components/schemas/UserRef'
                    description: User sở hữu thiết bị.
                  role:
                    $ref: './common.yaml#/components/schemas/Role'
                  device:
                    $ref: './common.yaml#/components/schemas/DeviceRef'
                  projects:
                    type: array
                    description: Project user là thành viên (chỉ những project này được thu thập).
                    items:
                      type: object
                      required: [id, name, slug, repoPatterns]
                      additionalProperties: false
                      properties:
                        id:
                          $ref: './common.yaml#/components/schemas/Id'
                        name:
                          type: string
                        slug:
                          $ref: './common.yaml#/components/schemas/ProjectSlug'
                        repoPatterns:
                          type: array
                          items:
                            $ref: './common.yaml#/components/schemas/RemotePattern'
        '401':
          $ref: './common.yaml#/components/responses/InvalidToken'

  /agent/v1/logout:
    post:
      operationId: agentLogout
      tags: [agent-auth]
      summary: Thu hồi token của chính thiết bị này
      security:
        - deviceToken: []
      responses:
        '204':
          description: Đã thu hồi token.
        '401':
          $ref: './common.yaml#/components/responses/InvalidToken'

  /agent/v1/web-login:
    post:
      operationId: agentWebLogin
      tags: [agent-auth]
      summary: Xin link đăng nhập dashboard một lần cho `tl open`
      description: |
        Member không có mật khẩu: `tl open` gọi endpoint này bằng device token rồi mở `url` trên trình
        duyệt. Ticket sống 60 giây, dùng một lần; DB chỉ lưu SHA-256 (bảng `web_login_tickets`).
      security:
        - deviceToken: []
      responses:
        '200':
          description: Link đăng nhập một lần.
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresIn]
                additionalProperties: false
                properties:
                  url:
                    type: string
                    format: uri
                    description: '`${TEAMLENS_PUBLIC_URL}/auth/cli?ticket=<ticket>`'
                    examples: [http://localhost:3000/auth/cli?ticket=abc]
                  expiresIn:
                    type: integer
                    examples: [60]
        '401':
          $ref: './common.yaml#/components/responses/InvalidToken'
