# Nhóm `skills`: Skill Finder (docs/AI_PLAN.md mục 3.2). Người 3.
# - GET /api/v1/projects/{projectId}/skill-clusters: S0, gom cụm prompt lặp lại bằng heuristic, KHÔNG gọi LLM (M6.11).
# Còn để sau (cùng file này):
# - POST /api/v1/skill-clusters/{clusterId}/ai/triage (S1, kind `skill_triage`, subjectType `skill_cluster`) và
#   POST /api/v1/skill-clusters/{clusterId}/ai/skill (S2, kind `skill_content`, trả SKILL.md) (M6.12)
# - GET/POST/PATCH/DELETE /api/v1/skill-catalog-sources và POST /api/v1/projects/{projectId}/ai/catalog-picks (S3, M6.13)
# Nút AI dùng chung mã lỗi `llm_*` của ai.yaml và schema `AiResult`.
paths:
  /api/v1/projects/{projectId}/skill-clusters:
    parameters:
      - $ref: './common.yaml#/components/parameters/ProjectId'
    get:
      operationId: listSkillClusters
      tags: [skills]
      summary: Các cụm prompt lặp lại của project (Skill Finder, S0)
      description: |
        Gom những prompt người dùng gõ lặp lại gần như giống nhau trong project, để gợi ý biến chúng thành skill hoặc
        chỉ dẫn dùng chung. Heuristic thuần, không gọi LLM, không tốn tiền.

        **Quyền:** leader thấy mọi thành viên (lọc được theo `userId`; xem dữ liệu của người khác ghi audit
        `skill_clusters.view`); member chỉ thấy prompt của chính mình (đặt `userId` của người khác trả `403`).

        **Cách gom (SPEC và AI_PLAN 3.2):** chỉ dùng prompt của **session gốc** (prompt trong session con do agent viết,
        SPEC 9.1). Bỏ prompt dưới 15 hoặc trên 2000 ký tự và prompt rác ("tiếp", "ok", "continue"...). Chuẩn hóa NFC, giữ chữ
        có dấu (tiếng Việt), thay mã, chuỗi, đường dẫn, URL, số bằng chỗ trống rồi tách từ, bỏ từ dừng tiếng Việt và tiếng Anh.
        "Dấu vân tay" là 4 từ đầu tiên sau khi sắp xếp từ khóa theo thứ tự chữ cái; prompt cùng dấu vân tay vào một cụm. Cụm cần ít
        nhất 3 lần lặp. Đây là gần đúng (cụm có thể thiếu hoặc lẫn); S1 (AI) sẽ lọc lại.

        **Khoảng thời gian:** `from` (>=) và `to` (<) theo thời điểm của prompt, ISO 8601. Mặc định 30 ngày gần nhất; tối đa
        90 ngày. Chỉ có prompt còn được lưu (retention). Tối đa 20000 prompt được xét; vượt thì lấy các prompt mới nhất và
        `stats.truncated` là `true`.

        **Đoạn trích** (`excerpt`) lấy từ nội dung prompt đã che secret ở máy thành viên, tối đa 160 ký tự.
      security:
        - cookieAuth: []
      parameters:
        - name: userId
          in: query
          required: false
          description: Chỉ prompt của người này (leader; member chỉ được đặt chính mình).
          schema:
            $ref: './common.yaml#/components/schemas/Id'
        - name: from
          in: query
          required: false
          description: Chỉ prompt từ mốc này (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Chỉ prompt trước mốc này (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Số cụm tối đa trả về (cụm nhiều lần lặp nhất trước).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Các cụm, nhiều lần lặp nhất trước. `clusters` rỗng khi chưa có prompt nào lặp đủ 3 lần.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillClusterList'
              example:
                range:
                  from: '2026-10-29T00:00:00.000Z'
                  to: '2026-11-28T00:00:00.000Z'
                stats:
                  promptsAnalyzed: 412
                  promptsClustered: 31
                  clusterCount: 2
                  truncated: false
                clusters:
                  - id: 4f6c2d7e-1b3a-4c8e-9d5f-0a1b2c3d4e5f
                    label: Chạy pnpm test rồi sửa lỗi lint trong file này
                    count: 9
                    userCount: 2
                    firstSeenAt: '2026-11-03T08:12:00.000Z'
                    lastSeenAt: '2026-11-27T15:40:00.000Z'
                    users:
                      - userId: 0b9d8f9e-7c1a-4f4e-9b0e-2f6a1c3d4e5f
                        name: Thành viên 1
                        count: 6
                      - userId: 7a1c3d4e-5f60-4b9d-8f9e-0b9d8f9e7c1a
                        name: Thành viên 2
                        count: 3
                    examples:
                      - sessionId: 2356eb16-0734-42a0-9c8a-892a394bcaf2
                        turnSeq: 4
                        ts: '2026-11-27T15:40:00.000Z'
                        userId: 0b9d8f9e-7c1a-4f4e-9b0e-2f6a1c3d4e5f
                        excerpt: Chạy pnpm test rồi sửa lỗi lint trong file src/cart.ts
        '400':
          $ref: './common.yaml#/components/responses/ValidationError'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

components:
  schemas:
    SkillClusterList:
      type: object
      required: [range, stats, clusters]
      additionalProperties: false
      properties:
        range:
          type: object
          description: Khoảng thời gian thực tế đã dùng.
          required: [from, to]
          additionalProperties: false
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        stats:
          $ref: '#/components/schemas/SkillClusterStats'
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/SkillCluster'

    SkillClusterStats:
      type: object
      required: [promptsAnalyzed, promptsClustered, clusterCount, truncated]
      additionalProperties: false
      properties:
        promptsAnalyzed:
          type: integer
          minimum: 0
          description: Số prompt đã được xét (sau khi lọc session gốc, độ dài, prompt rác).
        promptsClustered:
          type: integer
          minimum: 0
          description: Số prompt nằm trong các cụm đủ 3 lần lặp (kể cả cụm vượt `limit`).
        clusterCount:
          type: integer
          minimum: 0
          description: Số cụm đủ 3 lần lặp (có thể nhiều hơn số cụm trả về khi vượt `limit`).
        truncated:
          type: boolean
          description: true khi có hơn 20000 prompt trong khoảng và chỉ các prompt mới nhất được xét.

    SkillCluster:
      type: object
      required: [id, label, count, userCount, firstSeenAt, lastSeenAt, users, examples]
      additionalProperties: false
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Id'
          description: |
            Mã ổn định của cụm (UUID sinh từ project và dấu vân tay), dùng làm `subjectId` cho nút AI ở M6.12.
            Không phụ thuộc bộ lọc người hay khoảng thời gian.
        label:
          type: string
          description: Prompt tiêu biểu của cụm (độ dài vừa), tối đa 200 ký tự, đã che secret.
        count:
          type: integer
          minimum: 3
          description: Số lần prompt lặp lại trong khoảng và bộ lọc đã chọn.
        userCount:
          type: integer
          minimum: 1
          description: Số thành viên đã gõ prompt thuộc cụm.
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        users:
          type: array
          description: Tối đa 5 người gõ nhiều nhất, theo số lần giảm dần.
          items:
            $ref: '#/components/schemas/SkillClusterUser'
        examples:
          type: array
          maxItems: 3
          description: Tối đa 3 lần xuất hiện gần nhất.
          items:
            $ref: '#/components/schemas/SkillClusterExample'

    SkillClusterUser:
      type: object
      required: [userId, name, count]
      additionalProperties: false
      properties:
        userId:
          $ref: './common.yaml#/components/schemas/Id'
        name:
          type: string
        count:
          type: integer
          minimum: 1

    SkillClusterExample:
      type: object
      required: [sessionId, turnSeq, ts, userId, excerpt]
      additionalProperties: false
      properties:
        sessionId:
          $ref: './common.yaml#/components/schemas/Id'
        turnSeq:
          type: integer
          minimum: 0
          description: '`seq` của prompt trong session (để nhảy tới đúng turn).'
        ts:
          type: string
          format: date-time
        userId:
          $ref: './common.yaml#/components/schemas/Id'
        excerpt:
          type: string
          description: Đoạn trích prompt, tối đa 160 ký tự, đã che secret, khoảng trắng đã gộp.
