# Nhóm `users`: leader quản lý tài khoản (SPEC 11.1).
# Member tự tạo tài khoản qua link mời (`tl join`), không có email/mật khẩu; ở đây leader chỉ
# thêm leader khác (có email + mật khẩu) và đổi vai trò.
paths:
  /api/v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Danh sách user (leader)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Mọi user chưa bị xóa.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './common.yaml#/components/schemas/User'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
    post:
      operationId: createLeader
      tags: [users]
      summary: Thêm một leader mới (leader)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 8
      responses:
        '201':
          description: Leader vừa tạo.
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/User'
        '400':
          $ref: './common.yaml#/components/responses/ValidationError'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '409':
          description: 'Email đã được dùng (`error`: `email_taken`).'
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                error: email_taken
                message: Email này đã có tài khoản.

  /api/v1/users/{userId}:
    parameters:
      - $ref: './common.yaml#/components/parameters/UserId'
    patch:
      operationId: updateUserRole
      tags: [users]
      summary: Đổi vai trò của user (leader)
      description: |
        Nâng member lên leader thì phải kèm `email` và `password` nếu user chưa có (để đăng nhập dashboard).
        Hạ leader xuống member thì giữ nguyên email/mật khẩu. Server luôn phải còn ít nhất một leader.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role:
                  $ref: './common.yaml#/components/schemas/Role'
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: User sau khi đổi vai trò.
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/User'
        '400':
          description: 'Body sai (`validation_error`), hoặc nâng lên leader mà thiếu email/mật khẩu (`credentials_required`).'
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          description: 'Hạ leader cuối cùng (`last_leader`) hoặc email đã được dùng (`email_taken`).'
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                error: last_leader
                message: Server phải còn ít nhất một leader.

  /api/v1/users/{userId}/merge:
    parameters:
      - $ref: './common.yaml#/components/parameters/UserId'
    post:
      operationId: mergeUser
      tags: [users]
      summary: Gộp user `userId` vào user khác (leader)
      description: |
        Dùng khi một người tham gia lần nữa (máy thứ hai, cài lại Windows) và thành user mới.
        Trong một transaction: chuyển `devices`, `sessions`, `consents`, `project_members` (bỏ trùng),
        `notes`, `ingest_batches` (bỏ trùng) của `userId` sang `intoUserId`; session trùng `source_id`
        giữ bản `updated_at` mới hơn; ghi audit `member.merge`; xóa user `userId`. Sau đó phát job chấm
        lại các session đã chuyển. Không gộp được user vào chính nó, và không gộp leader vào member.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intoUserId]
              additionalProperties: false
              properties:
                intoUserId:
                  $ref: './common.yaml#/components/schemas/Id'
      responses:
        '200':
          description: User còn lại sau khi gộp và số bản ghi đã chuyển.
          content:
            application/json:
              schema:
                type: object
                required: [user, moved]
                additionalProperties: false
                properties:
                  user:
                    $ref: './common.yaml#/components/schemas/User'
                  moved:
                    type: object
                    required: [devices, sessions, projects]
                    additionalProperties: false
                    properties:
                      devices:
                        type: integer
                      sessions:
                        type: integer
                      projects:
                        type: integer
        '400':
          description: 'Body sai (`validation_error`) hoặc gộp vào chính nó (`same_user`).'
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          description: 'Gộp leader vào member (`error`: `role_mismatch`); hạ vai trò trước rồi gộp.'
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
