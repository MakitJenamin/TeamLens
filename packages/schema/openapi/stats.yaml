# Nhóm `stats`: thống kê và điểm (cookieAuth), spec mục 7.4 và 10.
# - GET /api/v1/projects/{projectId}/overview: tổng quan project cho leader (M2.9).
# - GET /api/v1/users/{userId}/profile?project=: hồ sơ thành viên (M2.10).
# - GET|POST /api/v1/users/{userId}/ai/weekly-report: báo cáo tuần theo người do AI viết (B1, M6.8).
# - GET|POST /api/v1/projects/{projectId}/ai/weekly-report: báo cáo tuần của team do AI viết, chỉ leader (B2, M6.9).
# Còn để sau:
# - GET /api/v1/projects/{projectId}/leaderboard (M4.3)
#
# Số liệu tuần lấy từ `user_weekly_stats` (M2.8, xem docs/FLOW.md mục ⑧). Phân bố model, chi phí và các số liệu
# không tính điểm lấy từ `turns`, nên chỉ có khi turn còn trong thời hạn lưu (retention).
paths:
  /api/v1/projects/{projectId}/leaderboard:
    parameters:
      - $ref: './common.yaml#/components/parameters/ProjectId'
    get:
      operationId: getProjectLeaderboard
      tags: [stats]
      summary: Bảng xếp hạng của project theo tuần hoặc tháng UTC
      description: |
        Chỉ xếp hạng người có ít nhất 5 session gốc và có điểm ở nhóm được chọn.
        Tuần dùng user_weekly_stats, tháng tính từ session gốc bắt đầu trong tháng.
        Finding user_week của tháng thuộc về tháng chứa session đại diện của finding.
        Member chỉ xem khi hai công tắc cùng bật; danh tính người khác bị ẩn ngay ở API.
      security:
        - cookieAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month]
            default: week
        - name: at
          in: query
          description: Ngày thuộc kỳ, theo UTC; mặc định ngày hiện tại.
          schema:
            type: string
            format: date
        - name: category
          in: query
          schema:
            type: string
            enum: [overall, prompt_quality, context, correction_loop, session_management, verification]
            default: overall
      responses:
        '200':
          description: Bảng xếp hạng hoặc trạng thái đã tắt cho leader.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
        '400':
          $ref: './common.yaml#/components/responses/ValidationError'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          description: Member không được xem (`leaderboard_disabled`) hoặc không thuộc project (`forbidden`).
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /api/v1/projects/{projectId}/ai/weekly-report:
    parameters:
      - $ref: './common.yaml#/components/parameters/ProjectId'
    get:
      operationId: getTeamReport
      tags: [stats]
      summary: B2 · báo cáo tuần của team đã lưu của leader
      description: |
        Chỉ trả kết quả của chính người gọi (kind `weekly_team`, subjectType `project_week`, theo `week` và `locale`),
        hoặc `null`. **Chỉ leader** (member nhận `403`). Không đụng dữ liệu nên không ghi audit.
      security:
        - cookieAuth: []
      parameters:
        - name: week
          in: query
          required: false
          description: |
            Thứ Hai (UTC) của tuần, `YYYY-MM-DD`. Bỏ trống thì dùng tuần gần nhất mà project có session (tính cả tuần
            hiện tại).
          schema:
            type: string
            format: date
        - name: locale
          in: query
          required: false
          schema:
            $ref: './ai.yaml#/components/schemas/AiLocale'
      responses:
        '200':
          description: Kết quả đã lưu hoặc `null`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamReportSaved'
        '400':
          $ref: './common.yaml#/components/responses/ValidationError'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
    post:
      operationId: runTeamReport
      tags: [stats]
      summary: B2 · AI viết báo cáo tuần của team (leader)
      description: |
        Trả `AiResult` kind `weekly_team`, subjectType `project_week`, `result` theo `TeamReportResult`. Ghi đè bản cũ của
        người gọi (cùng project, tuần và locale). **Chỉ leader.** Kết quả chỉ người bấm đọc được.

        **Dữ liệu gửi cho LLM** (key của người gọi) chỉ là số liệu tổng hợp, **không có prompt và không có tên người**:
        số session, token, điểm 5 nhóm của tuần này, tuần trước; các rule bị vi phạm nhiều nhất trong team (khóa, nhóm,
        mức, số lần, số người mắc, lời khuyên); số session theo loại việc B4; và với từng thành viên có session trong
        tuần (tối đa 20) một mã ẩn danh (`m1`, `m2`...) kèm số session, điểm tổng, điểm tuần trước và mức thay đổi. Vì
        vậy không ghi audit.

        **Server giữ quyền quyết định số liệu:** AI chỉ viết lời nhận xét và chọn mục theo mã (`r1`... cho rule, `m1`...
        cho thành viên); `ruleKey`, `category`, `count`, `memberCount`, `userId`, `name`, `change` lấy từ dữ liệu của
        server, mã không hợp lệ hoặc trùng bị bỏ.

        **Xóa dữ liệu một người (M5.6):** kết quả nêu tên thành viên nên khi leader xóa dữ liệu của người đó, các kết quả
        `weekly_team` có nhắc tới họ cũng bị xóa.

        Lỗi riêng: `409 no_week_data` (project chưa có session nào trong tuần đó); `400 validation_error` khi `week`
        không phải thứ Hai hoặc ở tương lai. Chưa có key thì `409 llm_key_missing` trước khi đụng dữ liệu.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunTeamReportRequest'
      responses:
        '200':
          $ref: './ai.yaml#/components/responses/AiResultOk'
        '400':
          $ref: './common.yaml#/components/responses/ValidationError'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          description: |
            Chưa có API key (`llm_key_missing`) hoặc project chưa có session nào trong tuần đó (`no_week_data`).
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              examples:
                noKey:
                  value:
                    error: llm_key_missing
                    message: Bạn chưa cấu hình API key AI.
                noData:
                  value:
                    error: no_week_data
                    message: Project này chưa có session nào trong tuần đó.
        '422':
          $ref: './ai.yaml#/components/responses/LlmKeyRejected'
        '429':
          $ref: './ai.yaml#/components/responses/LlmQuotaExceeded'
        '502':
          $ref: './ai.yaml#/components/responses/LlmProviderError'
        '504':
          $ref: './ai.yaml#/components/responses/LlmTimeout'

  /api/v1/projects/{projectId}/overview:
    parameters:
      - $ref: './common.yaml#/components/parameters/ProjectId'
    get:
      operationId: getProjectOverview
      tags: [stats]
      summary: Tổng quan project (chỉ leader)
      description: |
        Số liệu gộp mọi thành viên của project trong một khoảng thời gian, chia theo tuần UTC (thứ Hai 00:00).
        Chỉ leader (mọi project); member nhận `403`.

        - `from` (>=) và `to` (<) theo `startedAt` của session, ISO 8601. Server làm tròn ra biên tuần UTC;
          `range` trả khoảng thực tế đã dùng. Mặc định: 8 tuần gần nhất, gồm tuần hiện tại.
        - `sessions` và điểm chỉ tính session gốc; `tokens` tính cả session con (SPEC 9.1).
        - Điểm tuần của project là trung bình điểm tuần của từng thành viên, trọng số là số session của họ
          trong tuần. Tuần chưa có session nào được chấm thì `scores` rỗng (`{}`).
        - Chi phí là **ước tính** từ bảng giá cố định theo model, không phải hóa đơn. Chỉ tính được khi turn
          còn được lưu: `estimatedCostUsd` là `null` khi không còn turn nào của kỳ đó. Token của model chưa có giá
          không được tính vào chi phí.
        - `usageStats` là số liệu tham khảo, **không tính điểm** và không vào leaderboard (RULES.md mục 2).
      security:
        - cookieAuth: []
      parameters:
        - name: from
          in: query
          required: false
          description: Chỉ tính session có `startedAt` >= mốc này (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Chỉ tính session có `startedAt` < mốc này (ISO 8601).
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Tổng quan project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOverview'
              example:
                range:
                  from: '2026-11-02T00:00:00.000Z'
                  to: '2026-11-16T00:00:00.000Z'
                totals:
                  sessions: 36
                  activeMembers: 2
                  tokens: 4820000
                  estimatedCostUsd: 31.4
                weeks:
                  - week: '2026-11-02'
                    sessions: 18
                    tokens: 2400000
                    estimatedCostUsd: 15.2
                    scores:
                      prompt_quality: 74
                      context: 80
                      correction_loop: 68
                      session_management: 85
                      verification: 60
                  - week: '2026-11-09'
                    sessions: 18
                    tokens: 2420000
                    estimatedCostUsd: 16.2
                    scores: {}
                byAgent:
                  - agent: claude_code
                    sessions: 30
                    tokens: 4100000
                  - agent: codex
                    sessions: 6
                    tokens: 720000
                byModel:
                  - model: claude-opus-4-6
                    turns: 410
                    tokens: 3900000
                    estimatedCostUsd: 28.9
                  - model: null
                    turns: 12
                    tokens: 90000
                    estimatedCostUsd: null
                usageStats:
                  cacheHitRate: 0.62
                  premiumModelRate: 0.8
                  highReasoningRate: 0.1
                  avgOutputTokensPerTurn: 540
                topFindings:
                  - ruleKey: no-test-after-edit
                    category: verification
                    severity: high
                    count: 15
                    memberCount: 2
        '400':
          $ref: './common.yaml#/components/responses/ValidationError'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /api/v1/users/{userId}/ai/weekly-report:
    parameters:
      - $ref: './common.yaml#/components/parameters/UserId'
    get:
      operationId: getWeeklyReport
      tags: [stats]
      summary: B1 · báo cáo tuần đã lưu của người gọi về một thành viên
      description: |
        Chỉ trả kết quả của chính người gọi (kind `weekly_user`, subjectType `user_week`, theo `project`, `week` và
        `locale`), hoặc `null`. Quyền như hồ sơ thành viên: member chỉ hỏi về chính mình (hỏi người khác trả `403`),
        leader hỏi về mọi thành viên của project. Không dựng lại dữ liệu nên không ghi audit.
      security:
        - cookieAuth: []
      parameters:
        - name: project
          in: query
          required: true
          schema:
            $ref: './common.yaml#/components/schemas/Id'
        - name: week
          in: query
          required: false
          description: |
            Thứ Hai (UTC) của tuần, `YYYY-MM-DD`. Bỏ trống thì dùng tuần gần nhất mà thành viên có session (tính cả tuần
            hiện tại).
          schema:
            type: string
            format: date
        - name: locale
          in: query
          required: false
          schema:
            $ref: './ai.yaml#/components/schemas/AiLocale'
      responses:
        '200':
          description: Kết quả đã lưu hoặc `null`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyReportSaved'
        '400':
          $ref: './common.yaml#/components/responses/ValidationError'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
    post:
      operationId: runWeeklyReport
      tags: [stats]
      summary: B1 · AI viết báo cáo tuần của một thành viên
      description: |
        Trả `AiResult` kind `weekly_user`, subjectType `user_week`, `result` theo `WeeklyReportResult`. Ghi đè bản cũ của
        người gọi (cùng thành viên, project, tuần và locale). Kết quả chỉ người bấm đọc được; chủ dữ liệu (`subject_user_id`)
        là thành viên được báo cáo nên xóa dữ liệu của họ cũng xóa báo cáo này.

        **Quyền:** như hồ sơ thành viên. Member chỉ tạo báo cáo về chính mình; leader về mọi thành viên của project và
        khi đó ghi audit `weekly_report.ai` (prompt của người khác được gửi cho nhà cung cấp LLM).

        **Dữ liệu gửi cho LLM** (key của người gọi), không phải toàn bộ session của tuần: số liệu đã tính (số session,
        token, điểm 5 nhóm của tuần này, tuần trước và trung bình team), các rule bị vi phạm trong tuần (khóa, nhóm,
        mức, số lần, lời khuyên của rule), số session theo loại việc B4, và tối đa 3 ví dụ prompt thật chọn bằng heuristic:
        hai prompt thuộc session có finding mức cao hoặc nhiều nhất (`needs_work`) và một prompt của session điểm cao nhất
        (`good`), mỗi prompt cắt 400 ký tự (đã che secret ở máy thành viên).

        **Server giữ quyền quyết định số liệu:** AI chỉ viết lời nhận xét và chọn ví dụ theo mã; `sessionId`, `turnSeq`,
        `kind`, `excerpt` của ví dụ lấy từ dữ liệu của server, mã không hợp lệ bị bỏ.

        Lỗi riêng: `409 no_week_data` (tuần đó thành viên chưa có session nào); `400 validation_error` khi `week` không
        phải thứ Hai hoặc ở tương lai. Chưa có key thì `409 llm_key_missing` trước khi đụng dữ liệu.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunWeeklyReportRequest'
      responses:
        '200':
          $ref: './ai.yaml#/components/responses/AiResultOk'
        '400':
          $ref: './common.yaml#/components/responses/ValidationError'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          description: |
            Chưa có API key (`llm_key_missing`) hoặc thành viên chưa có session nào trong tuần đó (`no_week_data`).
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              examples:
                noKey:
                  value:
                    error: llm_key_missing
                    message: Bạn chưa cấu hình API key AI.
                noData:
                  value:
                    error: no_week_data
                    message: Thành viên này chưa có session nào trong tuần đó.
        '422':
          $ref: './ai.yaml#/components/responses/LlmKeyRejected'
        '429':
          $ref: './ai.yaml#/components/responses/LlmQuotaExceeded'
        '502':
          $ref: './ai.yaml#/components/responses/LlmProviderError'
        '504':
          $ref: './ai.yaml#/components/responses/LlmTimeout'

  /api/v1/users/{userId}/profile:
    parameters:
      - $ref: './common.yaml#/components/parameters/UserId'
    get:
      operationId: getMemberProfile
      tags: [stats]
      summary: Hồ sơ của một thành viên trong một project
      description: |
        Leader xem hồ sơ của bất kỳ thành viên nào trong project (ghi audit `profile.view`); member chỉ xem
        hồ sơ của chính mình (xem của người khác trả `403`). `404` khi project không tồn tại hoặc user không phải
        thành viên của project.

        - `project` bắt buộc. `from` (>=) và `to` (<) theo `startedAt` của session, ISO 8601; server làm tròn ra biên
          tuần UTC và trả khoảng thực tế ở `range`. Mặc định: 2 tuần gần nhất, gồm tuần hiện tại.
        - `scores` là điểm trung bình của thành viên trong khoảng (trọng số là số session mỗi tuần);
          `teamScores` là điểm trung bình của cả team trong cùng khoảng, trọng số theo số session. Cả member lẫn leader
          đều thấy `teamScores`. Nhóm chưa có điểm thì vắng mặt; chưa có điểm nào thì `{}`.
        - `weeks` có một phần tử cho mỗi tuần trong khoảng (tuần không có dữ liệu vẫn có mặt với số 0).
        - `patterns`: các rule thành viên này vi phạm nhiều nhất trong khoảng, tối đa 10, theo số lần giảm dần. Mỗi mục
          có lời khuyên của rule và tối đa 3 ví dụ. Đoạn trích (`excerpt`) lấy từ turn còn được lưu, đã che secret, tối đa
          160 ký tự; là `null` khi turn đã bị xóa theo retention hoặc khi turn không có văn bản (vd. compaction).
        - Danh sách session gần nhất của thành viên dùng API `GET /api/v1/projects/{projectId}/sessions?userId=`.
      security:
        - cookieAuth: []
      parameters:
        - name: project
          in: query
          required: true
          description: Project cần xem hồ sơ.
          schema:
            $ref: './common.yaml#/components/schemas/Id'
        - name: from
          in: query
          required: false
          description: Chỉ tính session có `startedAt` >= mốc này (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Chỉ tính session có `startedAt` < mốc này (ISO 8601).
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Hồ sơ thành viên.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberProfile'
              example:
                user:
                  id: 3b0b2a4e-6a7f-4a2c-9a3e-1d6d1f2a9a11
                  name: Thành viên 1
                projectId: 0d024bea-6aa6-4a9f-8c3d-70292ea86faa
                range:
                  from: '2026-11-09T00:00:00.000Z'
                  to: '2026-11-23T00:00:00.000Z'
                totals:
                  sessions: 12
                  tokens: 19400
                scores:
                  prompt_quality: 85
                  context: 99
                  correction_loop: 71
                  session_management: 92
                  verification: 60
                teamScores:
                  prompt_quality: 90
                  context: 99
                  correction_loop: 80
                  session_management: 95
                  verification: 78
                weeks:
                  - week: '2026-11-09'
                    sessions: 6
                    tokens: 9700
                    scores:
                      prompt_quality: 85
                      context: 99
                      correction_loop: 71
                      session_management: 92
                      verification: 60
                    teamScores:
                      prompt_quality: 90
                      context: 99
                      correction_loop: 80
                      session_management: 95
                      verification: 78
                  - week: '2026-11-16'
                    sessions: 6
                    tokens: 9700
                    scores: {}
                    teamScores: {}
                patterns:
                  - ruleKey: lazy-prompting
                    category: prompt_quality
                    severity: medium
                    count: 4
                    advice: Bổ sung mục tiêu và ngữ cảnh.
                    examples:
                      - sessionId: 8b1f1a64-2a27-4d83-a0a7-7d0e1c5f3a10
                        turnSeq: 3
                        message: 12/30 prompt trong tuần quá ngắn.
                        excerpt: fix
        '400':
          $ref: './common.yaml#/components/responses/ValidationError'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

components:
  schemas:
    LeaderboardEntry:
      type: object
      additionalProperties: false
      required: [rank, userId, name, isSelf, sessions, overall, scores]
      properties:
        rank:
          type: integer
          minimum: 1
        userId:
          type: [string, 'null']
          format: uuid
          description: null cho người khác khi người gọi là member.
        name:
          type: [string, 'null']
          description: null cho người khác khi người gọi là member.
        isSelf:
          type: boolean
        sessions:
          type: integer
          minimum: 5
        overall:
          type: [number, 'null']
        scores:
          $ref: '#/components/schemas/WeeklyScores'

    Leaderboard:
      type: object
      additionalProperties: false
      required: [projectId, period, category, from, to, leaderboardEnabled, leaderboardPublic, mySessions, sessionsNeeded, entries]
      properties:
        projectId:
          $ref: './common.yaml#/components/schemas/Id'
        period:
          type: string
          enum: [week, month]
        category:
          type: string
          enum: [overall, prompt_quality, context, correction_loop, session_management, verification]
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        leaderboardEnabled:
          type: boolean
        leaderboardPublic:
          type: boolean
        mySessions:
          type: integer
          minimum: 0
        sessionsNeeded:
          type: integer
          minimum: 0
          maximum: 5
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'

    ScoreCategory:
      type: string
      description: 5 nhóm kỹ năng (SPEC 9.1).
      enum:
        - prompt_quality
        - context
        - correction_loop
        - session_management
        - verification

    WeeklyScores:
      type: object
      description: Điểm 0–100 theo nhóm. Rỗng khi chưa có session nào được chấm; nhóm không có điểm thì vắng mặt.
      propertyNames:
        $ref: '#/components/schemas/ScoreCategory'
      additionalProperties:
        type: integer
        minimum: 0
        maximum: 100

    OverviewRange:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
          description: Thứ Hai 00:00 UTC của tuần đầu tiên (bao gồm).
        to:
          type: string
          format: date-time
          description: Thứ Hai 00:00 UTC sau tuần cuối cùng (không bao gồm).

    OverviewTotals:
      type: object
      required: [sessions, activeMembers, tokens, estimatedCostUsd]
      properties:
        sessions:
          type: integer
          minimum: 0
          description: Số session gốc trong khoảng.
        activeMembers:
          type: integer
          minimum: 0
          description: Số thành viên có ít nhất một session gốc trong khoảng.
        tokens:
          type: integer
          minimum: 0
          description: Tổng input + output + cache đọc + cache ghi của mọi session, kể cả session con.
        estimatedCostUsd:
          type: [number, 'null']
          minimum: 0
          description: Chi phí ước tính (USD), `null` khi không còn turn nào để tính.

    OverviewWeek:
      type: object
      required: [week, sessions, tokens, estimatedCostUsd, scores]
      properties:
        week:
          type: string
          format: date
          description: Ngày thứ Hai (UTC) của tuần.
        sessions:
          type: integer
          minimum: 0
        tokens:
          type: integer
          minimum: 0
        estimatedCostUsd:
          type: [number, 'null']
          minimum: 0
        scores:
          $ref: '#/components/schemas/WeeklyScores'

    OverviewAgent:
      type: object
      required: [agent, sessions, tokens]
      properties:
        agent:
          $ref: './sessions.yaml#/components/schemas/AgentKind'
        sessions:
          type: integer
          minimum: 0
          description: Số session gốc.
        tokens:
          type: integer
          minimum: 0
          description: Token của mọi session của agent này, kể cả session con.

    OverviewModel:
      type: object
      required: [model, turns, tokens, estimatedCostUsd]
      properties:
        model:
          type: [string, 'null']
          description: Tên model; `null` với các turn không ghi model.
        turns:
          type: integer
          minimum: 0
          description: Số turn của assistant chạy bằng model này.
        tokens:
          type: integer
          minimum: 0
        estimatedCostUsd:
          type: [number, 'null']
          minimum: 0
          description: 'Là `null` khi model chưa có trong bảng giá.'

    OverviewUsageStats:
      type: object
      description: Số liệu tham khảo, không tính điểm. Mỗi trường `null` khi không có dữ liệu để tính.
      required: [cacheHitRate, premiumModelRate, highReasoningRate, avgOutputTokensPerTurn]
      properties:
        cacheHitRate:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: cache đọc / (input + cache đọc + cache ghi).
        premiumModelRate:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Tỉ lệ turn của assistant chạy bằng model cao cấp.
        highReasoningRate:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Tỉ lệ turn có `reasoning_effort` mức cao, trên các turn có ghi mức suy luận.
        avgOutputTokensPerTurn:
          type: [number, 'null']
          minimum: 0
          description: Token output trung bình mỗi turn của assistant.

    OverviewWorkType:
      type: object
      description: Số session gốc theo nhãn loại việc B4.
      required: [workType, sessions]
      additionalProperties: false
      properties:
        workType:
          description: Loại việc; `null` là chưa phân loại.
          oneOf:
            - $ref: './ai.yaml#/components/schemas/SessionWorkType'
            - type: 'null'
        sessions:
          type: integer
          minimum: 1

    OverviewFinding:
      type: object
      description: Một anti-pattern hay gặp trong khoảng thời gian. Sắp xếp theo `count` giảm dần, tối đa 10 mục.
      required: [ruleKey, category, severity, count, memberCount]
      properties:
        ruleKey:
          type: string
          minLength: 1
        category:
          $ref: '#/components/schemas/ScoreCategory'
        severity:
          type: string
          enum: [low, medium, high]
        count:
          type: integer
          minimum: 1
          description: Số finding của rule này.
        memberCount:
          type: integer
          minimum: 1
          description: Số thành viên khác nhau mắc.

    ProjectOverview:
      type: object
      required: [range, totals, weeks, byAgent, byModel, usageStats, workTypes, topFindings]
      properties:
        range:
          $ref: '#/components/schemas/OverviewRange'
        totals:
          $ref: '#/components/schemas/OverviewTotals'
        weeks:
          type: array
          description: Mỗi tuần trong khoảng một phần tử, sắp xếp tăng dần; tuần không có dữ liệu vẫn có mặt với số 0.
          items:
            $ref: '#/components/schemas/OverviewWeek'
        byAgent:
          type: array
          items:
            $ref: '#/components/schemas/OverviewAgent'
        byModel:
          type: array
          description: Sắp xếp theo `tokens` giảm dần.
          items:
            $ref: '#/components/schemas/OverviewModel'
        usageStats:
          $ref: '#/components/schemas/OverviewUsageStats'
        workTypes:
          type: array
          description: |
            Thống kê loại việc B4 của các session gốc trong khoảng, nhiều session nhất trước (hòa thì theo tên loại,
            `null` cuối cùng). Chỉ có loại có ít nhất một session. Chưa phân loại là phần tử `workType: null`.
          items:
            $ref: '#/components/schemas/OverviewWorkType'
        topFindings:
          type: array
          items:
            $ref: '#/components/schemas/OverviewFinding'

    ProfileUser:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Id'
        name:
          type: string

    ProfileTotals:
      type: object
      required: [sessions, tokens]
      properties:
        sessions:
          type: integer
          minimum: 0
          description: Số session gốc của thành viên trong khoảng.
        tokens:
          type: integer
          minimum: 0
          description: Token của mọi session của thành viên, kể cả session con.

    ProfileWeek:
      type: object
      required: [week, sessions, tokens, scores, teamScores]
      properties:
        week:
          type: string
          format: date
          description: Ngày thứ Hai (UTC) của tuần.
        sessions:
          type: integer
          minimum: 0
        tokens:
          type: integer
          minimum: 0
        scores:
          $ref: '#/components/schemas/WeeklyScores'
        teamScores:
          $ref: '#/components/schemas/WeeklyScores'

    ProfileExample:
      type: object
      required: [sessionId, turnSeq, message, excerpt]
      properties:
        sessionId:
          $ref: './common.yaml#/components/schemas/Id'
        turnSeq:
          type: [integer, 'null']
          minimum: 0
          description: Số thứ tự turn làm bằng chứng; `null` nếu áp dụng cho cả session.
        message:
          type: string
          description: Nhận xét của rule cho lần vi phạm này.
        excerpt:
          type: [string, 'null']
          maxLength: 160
          description: Đoạn trích ngắn đã che secret; `null` khi turn đã bị xóa theo retention hoặc khi turn không có văn bản (vd. compaction).

    ProfilePattern:
      type: object
      required: [ruleKey, category, severity, count, advice, examples]
      properties:
        ruleKey:
          type: string
          minLength: 1
        category:
          $ref: '#/components/schemas/ScoreCategory'
        severity:
          type: string
          enum: [low, medium, high]
        count:
          type: integer
          minimum: 1
          description: Số lần thành viên này vi phạm rule trong khoảng.
        advice:
          type: [string, 'null']
          description: Lời khuyên của rule; `null` nếu rule không có.
        examples:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/ProfileExample'

    MemberProfile:
      type: object
      required: [user, projectId, range, totals, scores, teamScores, weeks, patterns]
      properties:
        user:
          $ref: '#/components/schemas/ProfileUser'
        projectId:
          $ref: './common.yaml#/components/schemas/Id'
        range:
          $ref: '#/components/schemas/OverviewRange'
        totals:
          $ref: '#/components/schemas/ProfileTotals'
        scores:
          $ref: '#/components/schemas/WeeklyScores'
        teamScores:
          $ref: '#/components/schemas/WeeklyScores'
        weeks:
          type: array
          items:
            $ref: '#/components/schemas/ProfileWeek'
        patterns:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ProfilePattern'

    RunWeeklyReportRequest:
      type: object
      required: [project, locale]
      additionalProperties: false
      properties:
        project:
          $ref: './common.yaml#/components/schemas/Id'
        locale:
          $ref: './ai.yaml#/components/schemas/AiLocale'
        week:
          type: string
          format: date
          description: Thứ Hai (UTC) của tuần. Bỏ trống thì dùng tuần gần nhất mà thành viên có session.

    WeeklyReportExample:
      type: object
      required: [sessionId, turnSeq, kind, excerpt, comment]
      additionalProperties: false
      properties:
        sessionId:
          $ref: './common.yaml#/components/schemas/Id'
        turnSeq:
          type: integer
          minimum: 0
        kind:
          type: string
          enum: [good, needs_work]
          description: '`good` là prompt của session điểm cao nhất; `needs_work` là prompt của session có finding nặng.'
        excerpt:
          type: string
          description: Nội dung prompt, cắt tối đa 400 ký tự (lấy từ dữ liệu của server).
        comment:
          type: string
          description: Nhận xét về ví dụ này, do AI viết.

    WeeklyReportResult:
      type: object
      description: '`result` của `AiResult` kind `weekly_user` (B1).'
      required: [week, headline, strengths, weaknesses, vsLastWeek, focus, examples]
      additionalProperties: false
      properties:
        week:
          type: string
          format: date
          description: Thứ Hai (UTC) của tuần được báo cáo (do server điền).
        headline:
          type: string
          description: Một đến hai câu tóm tắt tuần.
        strengths:
          type: array
          maxItems: 3
          items:
            type: string
        weaknesses:
          type: array
          maxItems: 3
          items:
            type: string
        vsLastWeek:
          type: string
          description: So với tuần trước (hoặc nói chưa có dữ liệu tuần trước).
        focus:
          type: object
          description: Một việc nên tập trong tuần tới.
          required: [title, detail]
          additionalProperties: false
          properties:
            title:
              type: string
            detail:
              type: string
        examples:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/WeeklyReportExample'

    WeeklyReportSaved:
      type: object
      required: [result]
      additionalProperties: false
      properties:
        result:
          description: Kết quả `weekly_user` của người gọi, hoặc null.
          oneOf:
            - $ref: './ai.yaml#/components/schemas/AiResult'
            - type: 'null'

    RunTeamReportRequest:
      type: object
      required: [locale]
      additionalProperties: false
      properties:
        locale:
          $ref: './ai.yaml#/components/schemas/AiLocale'
        week:
          type: string
          format: date
          description: Thứ Hai (UTC) của tuần. Bỏ trống thì dùng tuần gần nhất mà project có session.

    TeamReportIssue:
      type: object
      required: [ruleKey, category, severity, count, memberCount, comment]
      additionalProperties: false
      properties:
        ruleKey:
          type: string
        category:
          $ref: '#/components/schemas/ScoreCategory'
        severity:
          type: string
          enum: [low, medium, high]
        count:
          type: integer
          minimum: 1
          description: Số lần rule bị vi phạm trong tuần (từ dữ liệu của server).
        memberCount:
          type: integer
          minimum: 1
          description: Số thành viên mắc (từ dữ liệu của server).
        comment:
          type: string
          description: Nhận xét về vấn đề này, do AI viết.

    TeamReportImproved:
      type: object
      required: [userId, name, change, comment]
      additionalProperties: false
      properties:
        userId:
          $ref: './common.yaml#/components/schemas/Id'
        name:
          type: string
        change:
          type: [number, 'null']
          description: Thay đổi điểm tổng so với tuần trước (từ dữ liệu của server); null khi không có tuần trước.
        comment:
          type: string
          description: Nhận xét do AI viết.

    TeamReportResult:
      type: object
      description: '`result` của `AiResult` kind `weekly_team` (B2).'
      required: [week, headline, vsLastWeek, topIssues, improved, sharingSession]
      additionalProperties: false
      properties:
        week:
          type: string
          format: date
          description: Thứ Hai (UTC) của tuần được báo cáo (do server điền).
        headline:
          type: string
        vsLastWeek:
          type: string
          description: So với tuần trước (hoặc nói chưa có dữ liệu tuần trước).
        topIssues:
          type: array
          maxItems: 3
          description: Lỗi phổ biến nhất của team.
          items:
            $ref: '#/components/schemas/TeamReportIssue'
        improved:
          type: array
          maxItems: 3
          description: Thành viên tiến bộ trong tuần.
          items:
            $ref: '#/components/schemas/TeamReportImproved'
        sharingSession:
          type: object
          description: Gợi ý một buổi chia sẻ trong team.
          required: [topic, detail]
          additionalProperties: false
          properties:
            topic:
              type: string
            detail:
              type: string

    TeamReportSaved:
      type: object
      required: [result]
      additionalProperties: false
      properties:
        result:
          description: Kết quả `weekly_team` của người gọi, hoặc null.
          oneOf:
            - $ref: './ai.yaml#/components/schemas/AiResult'
            - type: 'null'
