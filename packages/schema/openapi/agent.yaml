#
# Endpoint cho CLI (xác thực `deviceToken`), spec mục 7.2 và 7.3:
# - POST /agent/v1/ingest: gửi một batch session theo session.v1.schema.json (IngestBatch),
#   nén gzip, tối đa 10 MB; idempotent theo batch_id; trả 202; 426 khi schema_version không hỗ trợ.
# - POST /agent/v1/heartbeat: trạng thái daemon, phiên bản CLI, agent phát hiện được, lỗi parse, kích thước hàng đợi.
# - GET /agent/v1/config: pattern remote, pattern redaction, ngưỡng cắt, phiên bản văn bản đồng ý, phiên bản CLI tối thiểu.
#
# Cách thêm endpoint:
# 1. Viết path item dưới `paths:` bên dưới (path đầy đủ, vd. `/api/v1/...`), schema dùng chung
#    tham chiếu `./common.yaml#/components/...`.
# 2. Trong openapi/openapi.yaml thêm một dòng dưới `paths:`, vd.
#      /agent/v1/ingest:
#        $ref: './agent.yaml#/paths/~1agent~1v1~1ingest'
#    (`/` trong path viết thành `~1` theo JSON Pointer).
# 3. Chạy `pnpm --filter @teamlens/schema build` và commit cả src/generated/api.ts.
