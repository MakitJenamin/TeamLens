# Nhóm `agent`: endpoint cho CLI (xác thực `deviceToken`), spec mục 7.2 và 7.3.
# - POST /agent/v1/ingest (M1.1): gửi một batch session theo session.v1.schema.json (`IngestBatch`).
# - GET /agent/v1/config (M2.2): cấu hình CLI tải mỗi lần sync.
# - POST /agent/v1/heartbeat (M3.3): thiết bị báo trạng thái mỗi 15 phút và ngay khi `tl pause`/`tl resume`.
#
# Payload ingest dùng snake_case theo `session.v1.schema.json` (file đó là nguồn chân lý, OpenAPI
# chỉ tham chiếu `$defs/IngestBatch`); response ingest dùng camelCase như mọi REST API khác.
# Riêng response `GET /agent/v1/config` dùng snake_case (shape đã chốt với CLI ở M2.2); heartbeat
# (request và response) cũng dùng snake_case cho đồng bộ với config.
paths:
  /agent/v1/ingest:
    post:
      operationId: agentIngest
      tags: [agent]
      summary: Gửi một batch session đã chuẩn hóa
      description: |
        CLI gửi batch session đã lọc phạm vi theo git remote, đã che secret và đã cắt output (spec mục 6).

        **Giới hạn:** body tối đa 10 MB (tính sau khi giải nén); nên nén gzip và gửi kèm
        `Content-Encoding: gzip`. Tối đa 60 request/phút mỗi thiết bị.

        **Ngữ nghĩa (spec 7.3):**
        - Idempotent theo `batch_id`: gửi lại batch đã nhận thì server không ghi lại mà trả lại kết quả
          của lần đầu, kèm `duplicate: true`.
        - Session upsert theo `(user_id, source_id)`; turn upsert theo `(session_id, seq)`, nên gửi tăng dần
          (chỉ các turn mới) và gửi lại đều an toàn.
        - Mỗi session được kiểm tra riêng: `repo_remote` phải khớp repo pattern của một project mà user là
          thành viên (pattern cụ thể nhất thắng). Session không đạt nằm trong `rejected`, các session khác
          vẫn được nhận; cả batch vẫn trả `202`.
        - `parent_source_id` trỏ tới session chưa có trên server thì vẫn nhận; liên kết cha–con được nối
          khi session cha tới sau.
        - Session được nhận sinh job `session.ingested` (pg-boss) trong cùng transaction để chạy rule.

        **Phiên bản:** server đọc `schema_version` trước khi validate chi tiết; giá trị không hỗ trợ trả `426`
        kèm phiên bản CLI tối thiểu để CLI tự cập nhật.
      security:
        - deviceToken: []
      parameters:
        - name: Content-Encoding
          in: header
          required: false
          description: '`gzip` khi body được nén (khuyến nghị). Bỏ trống khi gửi JSON thô.'
          schema:
            type: string
            enum: [gzip]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../session.v1.schema.json#/$defs/IngestBatch'
      responses:
        '202':
          description: Batch đã được nhận (có thể một phần, xem `rejected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
              example:
                batchId: 0b6f3a3e-2f5d-4c1b-9a8e-6d1f7c2e4a10
                duplicate: false
                accepted:
                  - sourceId: claude_code:5e1c2d3a-7b8f-4c6d-9e0a-1b2c3d4e5f60
                    sessionId: 3f1e2d4c-5b6a-4789-8a0b-1c2d3e4f5a6b
                    turnsUpserted: 6
                rejected:
                  - sourceId: claude_code:9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d
                    error: repo_not_in_project
                    message: Repo github.com/acme/private-tool không thuộc project nào bạn là thành viên.
        '400':
          description: |
            Body không hợp lệ theo `session.v1.schema.json`, JSON hỏng hoặc gzip hỏng
            (`error`: `validation_error`). Cả batch bị từ chối; CLI không nên gửi lại nguyên văn.
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                error: validation_error
                message: 'Batch không hợp lệ: /sessions/0/turns/3/seq phải là số nguyên không âm.'
        '401':
          $ref: './common.yaml#/components/responses/InvalidToken'
        '403':
          description: |
            Thiết bị chưa đồng ý hoặc đã rút đồng ý gửi dữ liệu (`error`: `consent_required`).
            Cả batch bị từ chối; CLI dừng gửi và nhắc người dùng chạy `tl consent`.
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                error: consent_required
                message: Thiết bị này chưa đồng ý chia sẻ dữ liệu. Chạy `tl consent` để xem và đồng ý.
        '413':
          description: 'Body vượt 10 MB (`error`: `payload_too_large`). CLI cần chia nhỏ batch.'
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                error: payload_too_large
                message: Batch vượt quá 10 MB, hãy chia nhỏ rồi gửi lại.
        '426':
          description: |
            `schema_version` không được hỗ trợ (`error`: `unsupported_schema_version`).
            CLI cần cập nhật lên tối thiểu `minCliVersion`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsupportedSchemaVersionError'
              example:
                error: unsupported_schema_version
                message: Phiên bản dữ liệu 2 không được hỗ trợ. Hãy cập nhật tl lên bản 0.2.0 trở lên.
                supportedSchemaVersions: [1]
                minCliVersion: 0.2.0
        '429':
          description: 'Vượt 60 request/phút của thiết bị (`error`: `rate_limited`). Thử lại sau `Retry-After` giây.'
          headers:
            Retry-After:
              description: Số giây nên chờ trước khi gửi lại.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                error: rate_limited
                message: Gửi quá nhanh, thử lại sau ít phút.
  /agent/v1/config:
    get:
      operationId: agentGetConfig
      tags: [agent]
      summary: Cấu hình cho CLI (phạm vi repo, che secret, ngưỡng cắt, phiên bản)
      description: |
        CLI tải mỗi lần `tl sync` (spec 6.2, 6.3, 7.2) và cache bản gần nhất để dùng khi mất mạng.

        - `repo_patterns`: repo pattern của mọi project mà user của thiết bị là thành viên. Session có
          `repo_remote` không khớp pattern nào không được rời máy.
        - `redaction_patterns`: pattern che secret bổ sung do leader cấu hình (bảng `settings`, key
          `redaction_patterns`), chạy thêm sau bộ pattern có sẵn của CLI.
        - `truncation`: ngưỡng cắt (byte, UTF-8) do server chỉ định; thiếu key thì dùng mặc định.
        - `consent_text_version`: phiên bản văn bản đồng ý hiện hành. Khác phiên bản máy đã đồng ý thì CLI
          ngừng gửi và nhắc người dùng đồng ý lại.
        - `min_cli_version`: phiên bản `tl` tối thiểu (semver). CLI cũ hơn ngừng gửi và báo cần cập nhật.

        **Lưu ý:** khác các REST API khác, JSON của endpoint này dùng snake_case.
      security:
        - deviceToken: []
      responses:
        '200':
          description: Cấu hình hiện hành cho thiết bị.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfig'
              example:
                repo_patterns:
                  - project_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    pattern: github.com/org/*
                redaction_patterns:
                  - id: acme_internal_token
                    regex: 'acme_[A-Za-z0-9]{32}'
                truncation:
                  tool_input_bytes: 4096
                  output_head_bytes: 2048
                  output_tail_bytes: 1024
                  diff_bytes: 262144
                  thinking_bytes: 8192
                consent_text_version: 2026-11-27.2
                min_cli_version: 0.1.0
        '401':
          $ref: './common.yaml#/components/responses/InvalidToken'

  /agent/v1/heartbeat:
    post:
      operationId: agentHeartbeat
      tags: [agent]
      summary: Thiết bị báo trạng thái (heartbeat)
      description: |
        CLI gửi mỗi 15 phút khi daemon chạy, một lần cuối mỗi `tl sync` và ngay khi `tl pause`/`tl resume`
        (spec 4.1, 4.2, 7.2).

        **Ngữ nghĩa:**
        - Server ghi `devices.last_seen_at = now()`, `devices.cli_version` và `devices.status` theo `status`
          (`online` hoặc `paused`). Thiết bị đang ở `consent_revoked` (đã rút đồng ý, M3.7) giữ nguyên
          trạng thái đó; heartbeat vẫn được ghi nhận.
        - Số liệu (`agents`, `parse_errors`, `queue`) là ảnh chụp tại thời điểm gửi; server chỉ giữ bản
          gần nhất của mỗi thiết bị để hiện trên dashboard.
        - Không có heartbeat quá 30 phút thì dashboard coi thiết bị là `offline` (tính khi đọc, không ghi
          vào DB).
        - Response trả trạng thái server đang ghi nhận cùng `consent_text_version`, `min_cli_version` để
          daemon biết khi nào cần tải lại `GET /agent/v1/config` (đổi văn bản đồng ý, cần cập nhật CLI)
          mà không phải tải config mỗi 15 phút.

        **Giới hạn:** tối đa 20 request/phút mỗi thiết bị.

        **Lưu ý:** JSON của endpoint này dùng snake_case như `GET /agent/v1/config`.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
            example:
              status: online
              cli_version: 0.1.0
              agents:
                - agent: claude_code
                  version: 2.1.3
                  files: 12
                - agent: codex
                  version: null
                  files: 0
              parse_errors: 1
              queue:
                batches: 2
                bytes: 48213
                dropped: 0
                failed: 0
              sent_at: '2026-11-27T08:15:00Z'
      responses:
        '200':
          description: Đã ghi nhận heartbeat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResult'
              example:
                status: online
                consent_text_version: 2026-11-27.2
                min_cli_version: 0.1.0
        '400':
          description: 'Body không hợp lệ (`error`: `validation_error`).'
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                error: validation_error
                message: 'Heartbeat không hợp lệ: status phải là online hoặc paused.'
        '401':
          $ref: './common.yaml#/components/responses/InvalidToken'
        '429':
          description: 'Vượt 20 request/phút của thiết bị (`error`: `rate_limited`). Thử lại sau `Retry-After` giây.'
          headers:
            Retry-After:
              description: Số giây nên chờ trước khi gửi lại.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                error: rate_limited
                message: Gửi quá nhanh, thử lại sau ít phút.

components:
  schemas:
    HeartbeatRequest:
      type: object
      description: Trạng thái thiết bị CLI gửi lên (snake_case).
      required: [status, cli_version, agents, parse_errors, queue, sent_at]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [online, paused]
          description: '`paused` sau `tl pause` (không quét, không gửi); `online` khi đang thu thập.'
        cli_version:
          type: string
          maxLength: 32
          description: Phiên bản `tl` (semver `x.y.z`).
          examples: [0.1.0]
        agents:
          type: array
          maxItems: 16
          description: Agent CLI phát hiện trên máy (mỗi loại agent tối đa một phần tử).
          items:
            $ref: '#/components/schemas/HeartbeatAgent'
        parse_errors:
          type: integer
          minimum: 0
          description: Số lỗi parse đang ghi nhận trong `state.db` (bản ghi log lạ bị bỏ qua).
        queue:
          $ref: '#/components/schemas/HeartbeatQueue'
        sent_at:
          type: string
          format: date-time
          description: Thời điểm CLI gửi (giờ máy, chỉ để tham khảo; server dùng giờ của mình cho `last_seen_at`).

    HeartbeatAgent:
      type: object
      required: [agent, version, files]
      additionalProperties: false
      properties:
        agent:
          $ref: '../session.v1.schema.json#/$defs/AgentKind'
        version:
          type: [string, 'null']
          maxLength: 64
          description: Phiên bản agent đọc được từ log gần nhất; null nếu chưa biết.
        files:
          type: integer
          minimum: 0
          description: Số file log của agent CLI tìm thấy.

    HeartbeatQueue:
      type: object
      description: Hàng đợi gửi offline trên máy (spec 4.4).
      required: [batches, bytes, dropped, failed]
      additionalProperties: false
      properties:
        batches:
          type: integer
          minimum: 0
          description: Số batch đang chờ gửi.
        bytes:
          type: integer
          minimum: 0
          description: Tổng kích thước hàng đợi (byte).
        dropped:
          type: integer
          minimum: 0
          description: Số batch đã bỏ vì hàng đợi đầy (cộng dồn).
        failed:
          type: integer
          minimum: 0
          description: Số batch gửi lỗi vĩnh viễn (cộng dồn).

    HeartbeatResult:
      type: object
      description: Trạng thái server ghi nhận cho thiết bị (snake_case).
      required: [status, consent_text_version, min_cli_version]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [online, paused, consent_revoked]
          description: |
            Trạng thái thiết bị trên server sau heartbeat. `consent_revoked`: thiết bị đã rút đồng ý,
            CLI ngừng gửi.
        consent_text_version:
          type: string
          description: Như `AgentConfig.consent_text_version`; khác bản máy đã đồng ý thì tải lại config.
          examples: [2026-11-27.2]
        min_cli_version:
          type: string
          description: Như `AgentConfig.min_cli_version`.
          examples: [0.1.0]

    AgentConfig:
      type: object
      description: Cấu hình CLI tải từ server (snake_case).
      required: [repo_patterns, redaction_patterns, truncation, consent_text_version, min_cli_version]
      additionalProperties: false
      properties:
        repo_patterns:
          type: array
          items:
            $ref: '#/components/schemas/AgentRepoPattern'
        redaction_patterns:
          type: array
          items:
            $ref: '#/components/schemas/AgentRedactionPattern'
        truncation:
          $ref: '#/components/schemas/AgentTruncation'
        consent_text_version:
          type: string
          description: Phiên bản văn bản đồng ý hiện hành (giống `consentText.version` của link mời).
          examples: [2026-11-27.2]
        min_cli_version:
          type: string
          description: Phiên bản `tl` tối thiểu (semver `x.y.z`).
          examples: [0.1.0]

    AgentRepoPattern:
      type: object
      required: [project_id, pattern]
      additionalProperties: false
      properties:
        project_id:
          type: string
          format: uuid
        pattern:
          type: string
          description: Repo pattern đã chuẩn hóa (vd. `github.com/org/*`).

    AgentRedactionPattern:
      type: object
      required: [id, regex]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Tên loại secret; CLI thay đoạn khớp bằng `[REDACTED:<id>]`.
          examples: [acme_internal_token]
        regex:
          type: string
          description: |
            Biểu thức chính quy theo cú pháp crate `regex` của Rust (không có look-around, không
            backreference). CLI bỏ qua pattern biên dịch lỗi.
          examples: ['acme_[A-Za-z0-9]{32}']

    AgentTruncation:
      type: object
      description: Ngưỡng cắt tính bằng byte UTF-8 (spec 6.3).
      required: [tool_input_bytes, output_head_bytes, output_tail_bytes, diff_bytes, thinking_bytes]
      additionalProperties: false
      properties:
        tool_input_bytes:
          type: integer
          minimum: 0
          description: Tối đa cho `tool.input` (mặc định 4096).
        output_head_bytes:
          type: integer
          minimum: 0
          description: Phần đầu giữ lại của output tool (mặc định 2048).
        output_tail_bytes:
          type: integer
          minimum: 0
          description: Phần cuối giữ lại của output tool (mặc định 1024).
        diff_bytes:
          type: integer
          minimum: 0
          description: Tối đa cho diff (mặc định 262144).
        thinking_bytes:
          type: integer
          minimum: 0
          description: Tối đa cho thinking (mặc định 8192).

    IngestResult:
      type: object
      description: Kết quả ingest một batch. Mỗi session trong batch nằm ở đúng một trong `accepted` hoặc `rejected`.
      required: [batchId, duplicate, accepted, rejected]
      additionalProperties: false
      properties:
        batchId:
          type: string
          format: uuid
          description: '`batch_id` của batch vừa gửi.'
        duplicate:
          type: boolean
          description: true khi batch này đã được nhận trước đó; kết quả là kết quả của lần nhận đầu tiên.
        accepted:
          type: array
          items:
            $ref: '#/components/schemas/IngestAccepted'
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/IngestRejected'

    IngestAccepted:
      type: object
      required: [sourceId, sessionId, turnsUpserted]
      additionalProperties: false
      properties:
        sourceId:
          type: string
          description: '`source_id` của session trong batch.'
        sessionId:
          type: string
          format: uuid
          description: Id session trên server (dùng cho link dashboard `/sessions/{sessionId}`).
        turnsUpserted:
          type: integer
          minimum: 0
          description: Số turn được thêm hoặc cập nhật.

    IngestRejected:
      type: object
      required: [sourceId, error, message]
      additionalProperties: false
      properties:
        sourceId:
          type: string
          description: '`source_id` của session bị từ chối.'
        error:
          type: string
          description: |
            Mã lý do:
            - `repo_not_in_project`: `repo_remote` không khớp repo pattern của project nào user là thành viên;
            - `invalid_session`: hợp lệ theo schema nhưng sai về ngữ nghĩa (vd. `seq` trùng nhau trong batch,
              `ended_at` trước `started_at`).
            CLI không gửi lại session bị từ chối cho tới khi cấu hình hoặc dữ liệu thay đổi.
          enum: [repo_not_in_project, invalid_session]
        message:
          type: string
          description: Mô tả tiếng Việt cho người dùng.

    UnsupportedSchemaVersionError:
      description: Lỗi `426` khi `schema_version` không được hỗ trợ.
      allOf:
        - $ref: './common.yaml#/components/schemas/Error'
        - type: object
          required: [supportedSchemaVersions, minCliVersion]
          properties:
            supportedSchemaVersions:
              type: array
              items:
                type: integer
              examples: [[1]]
            minCliVersion:
              type: string
              description: Phiên bản `tl` tối thiểu gửi được schema mà server hỗ trợ.
              examples: [0.2.0]
