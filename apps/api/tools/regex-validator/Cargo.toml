[package]
name = "regex-validator"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Kiểm tra pattern redaction theo đúng crate regex và giới hạn của CLI tl (M4.6)."

# Tách khỏi workspace của cli/: crate này chỉ phục vụ API.
[workspace]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
