name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PR: commit mới huỷ lần chạy cũ của cùng PR. Push lên main: chạy hết từng commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Xem PR đổi những vùng nào để bỏ qua job không liên quan.
  # Job bị skip vì `if:` vẫn được tính là đạt cho required check, nên không kẹt branch protection.
  # Push lên main luôn chạy đủ (lưới an toàn nếu bộ lọc thiếu, và làm mới cache Rust).
  # Nếu chính job `changes` lỗi thì chạy đủ, không skip (tránh skip được tính là đạt).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pin theo commit SHA (v4.0.3) để tránh tag bị thay đổi.
      - name: Lọc đường dẫn thay đổi
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: |
            js:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            rust:
              - 'cli/**'
              - 'packages/schema/**'
              - '.github/workflows/ci.yml'

  validate:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.result != 'success' || needs.changes.outputs.js == 'true') }}
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Phiên bản pnpm lấy từ trường `packageManager` trong package.json gốc.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Type sinh từ OpenAPI đã được commit
        run: git diff --exit-code -- packages/schema/src/generated/api.ts

  # e2e của API trên Postgres thật, kèm helper Rust `regex-validator` để test lưu pattern redaction
  # chạy đúng đường thật (không rơi vào nhánh 503 `regex_validator_unavailable`).
  api-e2e:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.result != 'success' || needs.changes.outputs.js == 'true') }}
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgres://teamlens:teamlens@localhost:5432/teamlens
      TEST_DATABASE_URL: postgres://teamlens:teamlens@localhost:5432/teamlens_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teamlens
          POSTGRES_PASSWORD: teamlens
          POSTGRES_DB: teamlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust (regex-validator)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api/tools/regex-validator

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build regex-validator
        run: pnpm --filter @teamlens/api build:regex-validator

      - name: e2e API
        run: pnpm --filter @teamlens/api test:e2e

  # Chạy song song với `validate` (khi cả hai cùng cần chạy). Dùng Windows vì tl.exe có code riêng cho Windows (Credential Manager, mutex).
  rust-windows:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
