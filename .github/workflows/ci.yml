name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: JS/TS (build, lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teamlens
          POSTGRES_PASSWORD: teamlens
          POSTGRES_DB: teamlens
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U teamlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://teamlens:teamlens@localhost:5433/teamlens
      TEAMLENS_PUBLIC_URL: http://localhost:3000
      # Khóa chỉ dùng cho CI (32 byte 0 mã hóa base64), không phải secret.
      TEAMLENS_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cài dependency
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Kiểm tra type sinh từ OpenAPI đã được commit
        run: |
          if [ -f packages/schema/src/generated/api.ts ]; then
            git diff --exit-code -- packages/schema/src/generated/api.ts \
              || { echo "::error::src/generated/api.ts chưa cập nhật. Chạy 'pnpm --filter @teamlens/schema build' rồi commit."; exit 1; }
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Migration + seed + e2e API
        run: |
          pnpm --filter @teamlens/api db:migrate
          pnpm --filter @teamlens/api db:seed
          pnpm --filter @teamlens/api test:e2e

  # `hashFiles` không dùng được trong `if` cấp job, nên kiểm tra có `cli/Cargo.toml` ở một job nhỏ.
  detect:
    name: Phát hiện thành phần
    runs-on: ubuntu-latest
    outputs:
      has_cli: ${{ steps.check.outputs.has_cli }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: echo "has_cli=${{ hashFiles('cli/Cargo.toml') != '' }}" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust CLI (fmt, clippy, test)
    runs-on: windows-latest
    needs: detect
    if: ${{ needs.detect.outputs.has_cli == 'true' }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
